[main]

# -*- conf -*-

# shell=$SHELL (if set, otherwise user's default shell from /etc/passwd)
# term=foot (or xterm-256color if built with -Dterminfo=disabled)
# login-shell=no

# app-id=foot # globally set wayland app-id. Default values are "foot" and "footclient" for desktop and server mode
# title=foot
# locked-title=no

#font=JetBrainsMono Nerd Font Mono:size=13
#font=Iosevka Nerd Font Mono:size=14
#font=Caskaydia Cove Nerd Font Mono:size=15
font=Iosevka Nerd Font Mono:size=15:weight=semibold
font-bold=Iosevka Nerd Font Mono:size=15:weight=extrabold
font-italic=Iosevka Nerd Font Mono:size=15:weight=semibold:slant:italic
font-bold-italic=Iosevka Nerd Font Mono:size=15:weight=extrabold:slant:italic
# font-bold=<bold variant of regular font>
# font-italic=<italic variant of regular font>
# font-bold-italic=<bold+italic variant of regular font>
# font-size-adjustment=0.5
line-height=16.5
# letter-spacing=0
# horizontal-letter-offset=0
# vertical-letter-offset=0
# underline-offset=<font metrics>
# underline-thickness=<font underline thickness>
# strikeout-thickness=<font strikeout thickness>
# box-drawings-uses-font-glyphs=no
# dpi-aware=no
# gamma-correct-blending=no

# initial-color-theme=dark
# initial-window-size-pixels=700x500  # Or,
# initial-window-size-chars=<COLSxROWS>
# initial-window-mode=windowed
pad=20x20 center-when-maximized-and-fullscreen
# resize-by-cells=yes
# resize-keep-grid=yes
# resize-delay-ms=100

# bold-text-in-bright=no
# word-delimiters=,│`|:"'()[]{}<>
# selection-target=primary
# workers=<number of logical CPUs>
# utmp-helper=/usr/lib/utempter/utempter  # When utmp backend is ‘libutempter’ (Linux)
# utmp-helper=/usr/libexec/ulog-helper    # When utmp backend is ‘ulog’ (FreeBSD)

# uppercase-regex-insert=yes

[environment]
# name=value

[security]
# osc52=enabled  # disabled|copy-enabled|paste-enabled|enabled

[scrollback]
# lines=1000
# multiplier=3.0
indicator-position=none
# indicator-format=""

[cursor]
# style=block
# blink=no
# blink-rate=500
# beam-thickness=1.5
# underline-thickness=<font underline thickness>

[mouse]
hide-when-typing=yes
# alternate-scroll-mode=yes

[colors-dark]
alpha=0.83
background=282828
foreground=d4be98
blur=true
#cursor=343f44 d3c6aa

# Normal/regular colors (color palette 0-7)
regular0=665c54 # black
regular1=ea6962 # red
regular2=a9b665 # green
regular3=e78a4e # yellow
regular4=7daea3 # blue
regular5=d3869b # magenta
regular6=89b482 # cyan
regular7=d4be98 # white

# Bright colors (color palette 8-15)
bright0=928374 # bright black
bright1=ea6962 # bright red
bright2=a9b665 # bright green
bright3=d8a657 # bright yellow
bright4=7daea3 # bright blue
bright5=d3869b # bright magenta
bright6=89b482 # bright cyan
bright7=d4be98 # bright white

## Misc colors
selection-foreground=9da9a0
selection-background=505a60
urls=7fbbb3

# vim: ft=dosini
