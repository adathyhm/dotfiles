$font = Iosevka Nerd Font Mono
$text_color = rgb(D4BE98)
$entry_background_color = rgb(32302f)
$entry_border_color = rgb(45403d)
$entry_color = rgb(a89984)
$accent = rgb(A7C080)

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 3
}

input-field {
    monitor =
    size = 350, 50
    outline_thickness = 2
    rounding = 0

    inner_color = $entry_background_color
    outer_color = $entry_border_color
    font_color = $entry_color
    check_color = rgb(D8A657)
    fail_color = rgb(EA6962)

    font_family = $font
    placeholder_text = Enter password...
    fail_text = Incorrect password!
    fade_on_empty = false

    # uncomment to use a letter instead of a dot to indicate the typed password
    dots_text_format = 
    dots_size = 0.5
    dots_spacing = 0.2

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 180
    font_family = $font
    color = $text_color

    position = 0, 300
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font
    color = $text_color

    position = 0, 150
    halign = center
    valign = center
}
